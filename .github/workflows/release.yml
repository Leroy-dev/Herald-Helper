name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build HeraldHelper.slnx -v minimal

      - name: Test
        run: dotnet test HeraldHelper.slnx --no-build

      # Publishes a self-contained win-x64 build, bundles Chromium under
      # .playwright/package/.local-browsers (downloads it via playwright.ps1),
      # trims it, and produces artifacts/release/HeraldHelper-<ts>.exe + .7z.
      - name: Package release
        run: powershell -ExecutionPolicy Bypass -File scripts/release.ps1

      # gh CLI is preinstalled on the runner — avoids the deprecated
      # softprops/action-gh-release (Node 20) action entirely.
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $files = Get-ChildItem -Path "artifacts/release/HeraldHelper-*.exe","artifacts/release/HeraldHelper-*.7z"
          if ($files.Count -eq 0) { throw "No release artifacts found" }
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $files.FullName --clobber
          } else {
            gh release create $env:RELEASE_TAG $files.FullName --title "HeraldHelper $env:RELEASE_TAG" --generate-notes
          }
