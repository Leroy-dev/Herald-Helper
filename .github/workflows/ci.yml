name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Verify formatting
        run: dotnet format --verify-no-changes

      - name: Build
        run: dotnet build HeraldHelper.slnx -v minimal

      - name: Install Playwright browsers
        shell: pwsh
        run: |
          $script = Get-ChildItem -Path . -Recurse -Filter 'playwright.ps1' | Select-Object -First 1
          if ($null -eq $script) {
            Write-Error "playwright.ps1 not found after build"
            exit 1
          }
          & $script.FullName install chromium

      - name: Test
        run: dotnet test HeraldHelper.slnx --no-build

      - name: Catalog validation
        run: dotnet test HeraldHelper.slnx --no-build --filter "CatalogAndMigrationIntegrityTests"

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
